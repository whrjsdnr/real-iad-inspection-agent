[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "opencv-python>=5.1.0.95",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
